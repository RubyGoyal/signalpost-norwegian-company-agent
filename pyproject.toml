# Lets Signalpost install and run inside a Python virtual environment, for a harness that has uv
# or pip but no Node. The agent itself is unchanged TypeScript: this only brings its toolchain in
# as a Python dependency (nodejs-wheel-binaries ships the official Node and npm binaries from
# PyPI), and then runs the ordinary commands.
#
#   uv venv && uv pip install .        # or: python -m venv .venv && .venv/bin/pip install .
#   signalpost examples/sample-orgnrs.txt out
#
# The run command installs the Node dependencies on its first use (npm ci), then runs
# `npx tsx agent/run.ts <input-file> <out-dir>`, which is the same command the README gives.
[project]
name = "signalpost"
version = "5.0.0"
description = "Norwegian company profiles with evidence: a Node agent, installable and runnable from a Python environment"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["nodejs-wheel-binaries==24.19.0"]

[project.scripts]
signalpost = "signalpost_runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["signalpost_runner"]
package-dir = { "" = "python" }
